<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Siklus Fetch Decode Execute">
    <rect width="1000" height="520" rx="28" fill="#f8fafc"/>
    
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs>
<rect x="70" y="155" width="240" height="160" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
<text x="190" y="205" text-anchor="middle" font-size="30" font-weight="700">1. FETCH</text>
<text x="190" y="245" text-anchor="middle" font-size="19">Ambil instruksi</text>
<text x="190" y="275" text-anchor="middle" font-size="19">dari memori</text>
