<text x="500" y="205" text-anchor="middle" font-size="30" font-weight="700">2. DECODE</text>
<text x="500" y="245" text-anchor="middle" font-size="19">Terjemahkan</text>
<text x="500" y="275" text-anchor="middle" font-size="19">instruksi</text>
