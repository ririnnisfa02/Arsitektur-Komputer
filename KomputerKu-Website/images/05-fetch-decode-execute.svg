<text x="810" y="205" text-anchor="middle" font-size="30" font-weight="700">3. EXECUTE</text>
<text x="810" y="245" text-anchor="middle" font-size="19">Jalankan</text>
<text x="810" y="275" text-anchor="middle" font-size="19">instruksi</text>
<path d="M310 235 H370" stroke="#334155" stroke-width="5" marker-end="url(#b)"/>
<path d="M620 235 H680" stroke="#334155" stroke-width="5" marker-end="url(#b)"/>
