<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="RAM dan ROM">
    <rect width="1000" height="520" rx="28" fill="#f8fafc"/>
    
<rect x="120" y="95" width="330" height="320" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
<text x="285" y="150" text-anchor="middle" font-size="32" font-weight="700">RAM</text>
<text x="285" y="205" text-anchor="middle" font-size="22">Sementara</text>
<text x="285" y="250" text-anchor="middle" font-size="20">Dipakai saat program berjalan</text>
<text x="285" y="300" text-anchor="middle" font-size="20">Data hilang saat komputer</text>
<text x="285" y="330" text-anchor="middle" font-size="20">dimatikan</text>
<rect x="550" y="95" width="330" height="320" rx="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
<text x="715" y="150" text-anchor="middle" font-size="32" font-weight="700">ROM</text>
<text x="715" y="205" text-anchor="middle" font-size="22">Permanen</text>
<text x="715" y="250" text-anchor="middle" font-size="20">Menyimpan instruksi dasar</text>
<text x="715" y="300" text-anchor="middle" font-size="20">untuk proses menyalakan</text>
<text x="715" y="330" text-anchor="middle" font-size="20">komputer</text>

    </svg>