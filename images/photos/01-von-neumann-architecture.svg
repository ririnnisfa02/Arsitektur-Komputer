<rect x="330" y="150" width="340" height="230" rx="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="5"/><text x="500" y="190" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">CPU</text>
