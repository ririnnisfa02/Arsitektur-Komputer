<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Tiga fungsi utama sistem operasi">
    <rect width="1000" height="520" rx="28" fill="#f8fafc"/>
    
<rect x="60" y="80" width="260" height="330" rx="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
<text x="190" y="135" text-anchor="middle" font-size="27" font-weight="700">MEMORI</text>
<text x="190" y="190" text-anchor="middle" font-size="20">Mengatur RAM</text>
<text x="190" y="240" text-anchor="middle" font-size="18">Contoh:</text>
<text x="190" y="275" text-anchor="middle" font-size="18">banyak aplikasi</text>
<text x="190" y="305" text-anchor="middle" font-size="18">tetap terkelola</text>
<rect x="370" y="80" width="260" height="330" rx="25" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="500" y="135" text-anchor="middle" font-size="27" font-weight="700">FILE</text>
<text x="500" y="190" text-anchor="middle" font-size="20">Mengatur file</text>
<text x="500" y="240" text-anchor="middle" font-size="18">Contoh:</text>
<text x="500" y="275" text-anchor="middle" font-size="18">folder, nama file,</text>
<text x="500" y="305" text-anchor="middle" font-size="18">dan penyimpanan</text>
<rect x="680" y="80" width="260" height="330" rx="25" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="810" y="135" text-anchor="middle" font-size="27" font-weight="700">PROSES</text>
<text x="810" y="190" text-anchor="middle" font-size="20">Mengatur program</text>
<text x="810" y="240" text-anchor="middle" font-size="18">Contoh:</text>
<text x="810" y="275" text-anchor="middle" font-size="18">game + browser</text>
<text x="810" y="305" text-anchor="middle" font-size="18">berjalan bersama</text>
<text x="500" y="475" text-anchor="middle" font-size="20" fill="#475569">Tiga fungsi utama yang ditekankan dalam modul</text>

    </svg>